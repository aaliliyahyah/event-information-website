<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <title>Proposed SET Days event spaces</title>
  <desc>A schematic with an Exhibit Hall on the left, Computer Lab on the right, and Assembly Hall below. Not an official campus map.</desc>
  <rect width="800" height="500" fill="#f3f6fa"/>
  <path d="M400 0v500M0 265h800" stroke="#dce2ea" stroke-width="32"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="45" y="50" width="320" height="175" rx="8" fill="#142d50"/>
    <rect x="435" y="50" width="320" height="175" rx="8" fill="#f4cb54"/>
    <rect x="180" y="310" width="440" height="140" rx="8" fill="#e3e9f1" stroke="#a3afc0"/>
    <g fill="none" stroke="#f4cb54" stroke-width="3">
      <rect x="180" y="77" width="50" height="36"/>
      <path d="M194 113v12m22-12v12m-31 0h40"/>
    </g>
    <g fill="none" stroke="#142d50" stroke-width="3">
      <rect x="565" y="77" width="60" height="40" rx="3"/>
      <path d="M557 125h76m-38-8v8"/>
    </g>
    <text x="205" y="158" fill="#fff" font-size="28" font-weight="700" text-anchor="middle">Exhibit Hall</text>
    <text x="205" y="191" fill="#d5deeb" font-size="20" text-anchor="middle">Explore the exhibit</text>
    <text x="595" y="158" fill="#142d50" font-size="28" font-weight="700" text-anchor="middle">Computer Lab</text>
    <text x="595" y="191" fill="#142d50" font-size="20" text-anchor="middle">Explore the workshop</text>
    <text x="400" y="369" fill="#142d50" font-size="28" font-weight="700" text-anchor="middle">Assembly Hall</text>
    <text x="400" y="405" fill="#48566a" font-size="20" text-anchor="middle">Talks, opening &amp; robotics</text>
    <text x="28" y="478" fill="#48566a" font-size="18">ILLUSTRATIVE LAYOUT · NOT TO SCALE</text>
  </g>
</svg>
